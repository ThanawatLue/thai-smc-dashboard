[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "thai-smc-dashboard"
version = "0.1.0"
description = "Thai-market Smart Money Concept dashboard and setup scanner"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "pandas>=2.0.0",
    "tradingview-screener>=3.2.0",
    "yfinance>=0.2.40",
    "lxml",
    "html5lib",
    "SQLAlchemy>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.setuptools]
packages = ["th_smc", "portfolio_xray"]

[tool.setuptools.package-dir]
th_smc = "src/th_smc"
portfolio_xray = "src/portfolio_xray"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
